[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-search-scraper"
version = "1.0.0"
description = "Fast, standalone Facebook search scraper and MCP server. Free data extraction of pages, profiles, posts and reels without login."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
keywords = ["facebook", "scraper", "mcp", "model-context-protocol", "leads", "contact-scraper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
facebook-search-scraper = "facebook_search_scraper.cli:main"
fb-scraper = "facebook_search_scraper.cli:main"
